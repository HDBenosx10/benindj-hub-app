name: Gerar versão Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão nova (ex.: 0.7.0 ou 0.8.0-beta.1)'
        required: true
        default: '0.11.0'
        type: string
      publicar:
        description: 'Publicar imediatamente? Desmarcado cria rascunho.'
        default: false
        type: boolean
      prerelease:
        description: 'Marcar como pré-release'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ inputs.versao || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      HUB_RELEASE_VERSION: ${{ inputs.versao || github.ref_name }}
      HUB_PUBLISH: ${{ github.event_name == 'push' || inputs.publicar }}
      HUB_PRERELEASE: ${{ inputs.prerelease || false }}
      HUB_PROFILE: aluno
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - name: Validar versão ainda não utilizada
        run: node scripts/release-version.cjs
        working-directory: .
      - run: npm test
      - name: Montar executável
        run: npm run build
        working-directory: .
      - name: Garantir pacote com apenas Hello World
        run: node scripts/check-package.cjs
      - name: Abrir executável e conferir execução e persistência
        run: node scripts/smoke-desktop.cjs "dist/win-unpacked/BeninDJ Hub Aluno.exe"
        working-directory: .
      - name: Verificar saves ao atualizar da versão 0.9
        run: node scripts/validar-atualizacao.cjs
        working-directory: .
      - run: node scripts/checksum.cjs
        working-directory: .
      - run: node scripts/build-info.cjs
        working-directory: .
      - uses: actions/upload-artifact@v7
        with:
          name: benindj-hub-aluno-${{ inputs.versao || github.ref_name }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
          if-no-files-found: error
      - name: Criar release com a versão escolhida
        run: node scripts/publish-release.cjs
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remover rascunhos antigos após publicação
        if: env.HUB_PUBLISH == 'true'
        run: node scripts/limpar-rascunhos.cjs
        env:
          GH_TOKEN: ${{ github.token }}
