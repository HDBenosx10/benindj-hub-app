name: Verificar e montar aplicativo do aluno
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.cjs
      - run: npm test
      - run: npm run build
      - run: node scripts/check-package.cjs
      - run: node scripts/checksum.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: aplicativo-aluno-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Criar rascunho da release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arquivos = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @arquivos --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME @arquivos --draft --verify-tag --generate-notes --repo $env:GITHUB_REPOSITORY
          }
